events {
    worker_connections 4096;
}

http {
    # --- Basic settings ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 15m;

    # --- WebSocket upgrade map ---
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # --- Rate limiting ---
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;

    # --- SSL settings ---
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- Redirect all HTTP to HTTPS ---
    server {
        listen 80;
        server_name twatter.xyz relay.twatter.xyz media.twatter.xyz payments.twatter.xyz;
        return 301 https://$host$request_uri;
    }

    # --- Relay (WebSocket) ---
    server {
        listen 443 ssl;
        server_name relay.twatter.xyz;

        location / {
            proxy_pass http://relay:7777;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            limit_req zone=api burst=50 nodelay;
        }
    }

    # --- Media server ---
    server {
        listen 443 ssl;
        server_name media.twatter.xyz;

        location /upload {
            proxy_pass http://media:7778;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            limit_req zone=upload burst=3 nodelay;
        }

        location / {
            proxy_pass http://media:7778;
            proxy_set_header Host $host;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # --- Payment server (Lightning / Alby Hub) ---
    server {
        listen 443 ssl;
        server_name payments.twatter.xyz;

        location / {
            proxy_pass http://payment:7779;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            limit_req zone=api burst=20 nodelay;
            # CORS handled by payment server itself (Access-Control-Allow-Origin: *)
        }
    }
}
